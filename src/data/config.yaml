site:
  # 品牌名只在这里定义（&brandName）；metadata.title.default 与 fuwari.site.title 用别名引用，
  # 改名时不会漏掉 <title>/OG 或页头页脚（两个配置模块读的是同一份解析结果）
  name: &brandName 理科迷
  site: "https://lkm-ahz.ltd"
  base: "/"
  trailingSlash: false
  # googleSiteVerificationId: "<your-google-site-verification-token>"  # 省略即不输出验证 meta（schema 只允许 string，写 null 会让 YAML 校验失败）

metadata:
  title:
    default: *brandName
    template: "%s — LKM"
  description: "理科迷 (LKM) — 创立于 2014 年的科技爱好者社区。覆盖数学、物理、化学、生物、信息技术等多个学科，由普罗大众组成，让科学回归每一个人。"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: LKM
    images:
      - url: "~/assets/images/default.png"
        width: 1200
        height: 628
    type: website
  twitter:
    handle: "@lkm"
    site: "@lkm"
    cardType: summary_large_image

i18n:
  language: zh-cn
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: "/blog/posts/%slug%"
      robots:
        index: true

    list:
      isEnabled: true
      pathname: "blog"
      robots:
        index: true

    category:
      isEnabled: true
      pathname: "category"
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: "tag"
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: "system"

fuwari:
  site:
    title: *brandName
    subtitle: 科技爱好者社区
    lang: zh_CN
    themeColor:
      hue: 250
      fixed: false
    banner:
      enable: false
      src: assets/images/demo-banner.png
      position: center
      credit:
        enable: false
        text: ""
        url: ""
    toc:
      enable: true
      depth: 2
    favicon: []
  profile:
    avatar: assets/images/lkm-logo.jpg
    name: 理科迷LKM
    bio: 创立于 2014 年的科技爱好者社区
    links:
      - name: GitHub
        icon: fa6-brands:github
        url: https://github.com/LKM-AHZ

  license:
    enable: true
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/

  expressiveCode:
    theme: github-dark
