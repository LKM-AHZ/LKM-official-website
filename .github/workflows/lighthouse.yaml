name: Lighthouse Performance Budget

# 前端性能监测：对关键路径页跑 Lighthouse 实验室审计，对照 CWV 预算门槛（模块 0）。
# 说明：
#  - 本 job 仅在 main 分支 push/PR 触发，独立于 actions.yaml 的 CI 主流程。
#  - CI 环境无真实后端（API_URL 为空），页面的 SSR 会降级渲染，指标可能低于生产；
#    因此本 job 定位为「性能预算的门槛 + 基线记录」，阈值通过环境变量可调：
#      LIGHTHOUSE_LCP_MS / LIGHTHOUSE_CLS / LIGHTHOUSE_TBT_MS / LIGHTHOUSE_PERF
#  - 脚本输出 PASS/FAIL 并以退出码判定，超阈即 CI 失败（可用 continue-on-error 临时放行）。
#  - 先用宽松阈值立基线，本地/后端就绪后逐步收紧（见 docs 模块 0 计划）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse CWV budgets
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # 预算门槛（2026-08-20 完善为「分层 + JS 体积 delta」）：
      #   --runs=3 取中位滤 TBT 等噪声指标的单次抖动（此前 runs=1 被 CPU 负载误杀）。
      #   · 硬指标（超阈 exit1 拦截）：CLS / TBT / JS 体积 / JS 相对基线 delta。
      #   · 告警指标（::warning:: 不阻塞）：LCP / Perf / /editor 整页（已确认接受项）。
      #   · JS 基线（scripts/jsbudget-baseline.json，提交 git）防体积回归；大幅增长才拦。
      # 无后端降级下 LCP/TBT 绝对值偏高，以下 TBT 硬阈取 CI 中位可过的合理值。
      - name: Run Lighthouse budgets (layered)
        env:
          LIGHTHOUSE_LCP_MS: '4000'
          LIGHTHOUSE_CLS: '0.15'
          # TBT 为硬指标：CI(Linux) 中位 / ~319ms、treehole ~428ms，取 500 拦「真实回归」而非单次抖动
          LIGHTHOUSE_TBT_MS: '500'
          LIGHTHOUSE_PERF: '40'
          # JS 绝对阈仅防事故级暴增；真正的 per-page JS 回归由基线 delta 承担
          LIGHTHOUSE_JS_KB: '3500'
          LIGHTHOUSE_JS_DELTA_PCT: '8'
        run: pnpm run lighthouse:budget --runs=3
