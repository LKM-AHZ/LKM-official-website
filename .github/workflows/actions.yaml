name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 这些 job 只 checkout + 本地构建/测试，不需要写权限；显式收窄 GITHUB_TOKEN 作用域
permissions:
  contents: read

jobs:
  # ── 前端构建 ──
  build:
    runs-on: ubuntu-latest
    # 无上限时 install/build 卡住会占满 runner 直到 GitHub 6 小时默认上限
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm run build
          # 断言构建产物真的存在：原先的 ls -la 什么都验证不了，构建坏了这一步照样绿
          test -f dist/server/entry.mjs
        env:
          # sitemap 只在配置了稳定站点域名时才生成（astro.config.ts 里的 siteUrl 分支）。
          # CI 不设时 dist 里没有 sitemap-index.xml，check:seo 必然失败——这正是
          # a26b462「移除默认域名」之后 CI 变红的原因；用 RFC 2606 保留的 .example
          # 做「生产形态构建」，既不指真实站点，也让 SEO 检查真正跑到。
          PUBLIC_SITE_URL: https://lkm-ci.example
      # 把 dist 传给下面的产物检查 job：它此前重新 install+build 一遍，
      # 是 CI 里最贵的一段重复开销（dist 约 14MB，传输远便宜于重跑构建）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # ── 产物检查（SEO / 内部链接 / Bundle 预算） ──
  artifacts:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # 三条检查各自独立上报：原先串在同一个序列里，check:seo 一红，links/budget 就被
      # skip —— 门禁看着有、实际长期没跑（a26b462 之后一直如此）。
      - run: pnpm run check:seo
      - if: always()
        run: pnpm run check:links
      - if: always()
        run: pnpm run check:budget

  # ── 前端检查（类型 + ESLint + Prettier） ──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # ── 前端单元测试（Vitest） ──
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
